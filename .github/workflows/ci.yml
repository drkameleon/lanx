name: "Build & Test"
on:
    push:
        branches:
            - 'main'
        tags-ignore:
            - '**'
    pull_request:
        paths-ignore:
            - 'docs/*'
            - '*.yml'
            - '*.md'
            - 'LICENSE'

jobs:
    build:
        name: Test
        runs-on: ${{ 
            (matrix.os == 'linux')   && (matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest') ||
            (matrix.os == 'macos')   && (matrix.arch == 'arm64' && 'macos-latest' || 'macOS-15-intel') ||
            (matrix.os == 'windows') && 'windows-latest' || 
                                        'ubuntu-latest'  }}
        strategy:
            fail-fast: false
            matrix:
                include: 
                    - {os: linux,   arch: amd64}
                    - {os: linux,   arch: arm64}
                    - {os: freebsd, arch: amd64}
                    - {os: macos,   arch: amd64}
                    - {os: macos,   arch: arm64}
                    - {os: windows, arch: amd64}

        defaults:
            run:
                shell: ${{ 
                    (matrix.os == 'freebsd') && 'freebsd {0}' ||
                    (matrix.os == 'windows') && 'msys2 {0}'   || 
                                                'bash'        }}

        steps:
            - name: "Cancel similar actions in progress"
              uses: styfle/cancel-workflow-action@0.6.0
              with:
                access_token: ${{ github.token }}

            - name: "Setup Arturo"
              uses: arturo-lang/setup-arturo@main
              with:
                token: ${{ secrets.GITHUB_TOKEN }}
                os: ${{ matrix.os }}
                arch: ${{ matrix.arch }}

            - name: "Checkout"
              uses: actions/checkout@main
              with:
                submodules: recursive

            - name: Run tests
              run: |
                cd $GITHUB_WORKSPACE

                # start server in background
                arturo src/cli.art test &
                SERVER_PID=$!

                # wait for it to be ready
                i=0
                while [ $i -lt 30 ]; do
                    curl -s http://localhost:18966/ > /dev/null 2>&1 && break
                    sleep 0.5
                    i=$((i + 1))
                done

                # test HTML serves correctly
                curl -s -o /tmp/index.html http://localhost:18966/
                diff test/index.html /tmp/index.html

                # test CSS serves correctly with correct mimetype
                curl -s -o /tmp/style.css -D /tmp/style.headers http://localhost:18966/style.css
                diff test/style.css /tmp/style.css
                grep -qi "content-type: text/css" /tmp/style.headers

                # test binary file integrity
                # curl -s -o /tmp/test.jpg http://localhost:18966/test.jpg
                # cmp test/test.jpg /tmp/test.jpg

                # test directory listing returns 200
                curl -s -o /dev/null -w "%{http_code}" http://localhost:18966/subfolder/ | grep -q 200

                # test 404
                curl -s -o /dev/null -w "%{http_code}" http://localhost:18966/nope | grep -q 404

                # cleanup
                kill $SERVER_PID