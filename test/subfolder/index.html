<!DOCTYPE html>
<html lang="en">
<head>

	<title>Server Test</title>
	<link rel="stylesheet" href="../style.css">
</head>
<body>
	<div class="container">
		<h1>This is a subfolder test page</h1>

            <h2>File listing</h2>
            <p>Test if directory listing is working correctly.</p>
            <a href="listing" class="nav-link">

                </span>
                <span class="nav-link-arrow">→</span>
            </a>
        </div>

        <div class="check">
            <a href=".." class="nav-link">
                <span class="nav-link-icon">⬆️</span>
                <span class="nav-link-text">
                    <strong>../</strong>
                    <small>Go back to parent directory</small>
                </span>
                <span class="nav-link-arrow">→</span>
            </a>
        </div>
	</div>
